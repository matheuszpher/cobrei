services:
  - type: web
    name: cobrei
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOME_LOJA
        value: Mercadinho Bom Preço
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SENHA
        generateValue: true
