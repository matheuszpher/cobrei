# Cobrei: banco + API + web. Subir com: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    container_name: cobrei-db
    environment:
      POSTGRES_USER: fiado
      POSTGRES_PASSWORD: fiado
      POSTGRES_DB: fiado
    ports:
      - "5433:5432"
    volumes:
      - fiado-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiado -d fiado"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: cobrei-api
    environment:
      DATABASE_URL: postgresql://fiado:fiado@db:5432/fiado?schema=public
      JWT_SECRET: troque-este-segredo-em-producao
      NOME_LOJA: Mercadinho Bom Preço
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: cobrei-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  fiado-data:
